    <!--app-head-->
    <!-- Re-apply the palette picked in the palette panel (src/config/palettes.ts)
         before first paint. -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('enndor-palette') || 'null');
        if (saved && saved.props) {
          document.documentElement.dataset.palette = saved.id;
          for (var k in saved.props) document.documentElement.style.setProperty(k, saved.props[k]);
        }
      } catch (e) {}
    </script>
