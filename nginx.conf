# Alternate hostnames mapped to this Cloud Run service → one canonical domain,
# so search engines don't see the same site duplicated across domains.
server {
    listen 8080;
    server_name www.legisia.co jurisia.app www.jurisia.app;
    return 301 https://legisia.co$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloud Run terminates TLS, so nginx sees plain http — keep redirect
    # Location headers relative instead of building http:// URLs.
    absolute_redirect off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Legacy/alias paths → their canonical URL
    location = /politica-de-privacidad { return 301 /politica-de-tratamiento-de-datos; }
    location = /privacidad             { return 301 /politica-de-tratamiento-de-datos; }
    location = /terminos               { return 301 /terminos-y-condiciones; }
    location = /tyc                    { return 301 /terminos-y-condiciones; }

    # Vite's hashed build output never changes under the same name
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static files (images, PDFs, favicon) keep stable names, so cache
    # them for a week rather than forever
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|pdf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Pages are prerendered to /<route>/index.html at build time. No SPA
    # fallback: unknown URLs get a real 404 (not the homepage with a 200).
    location / {
        # /precios/ → /precios (one URL per page)
        rewrite ^/(.+)/$ /$1 permanent;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
